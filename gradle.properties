org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 enables built-in Kotlin by default, which conflicts with the
# external Kotlin/Compose plugins this project applies — keep external.
# newDsl=false keeps the legacy extension the external KGP casts to.
android.builtInKotlin=false
android.newDsl=false
